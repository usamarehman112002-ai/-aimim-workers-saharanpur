<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="kiteG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="url(#gold)" stroke-width="4" />
  
  <!-- Kite diamond -->
  <g transform="translate(64, 46) scale(0.65)">
    <polygon points="0,-48 -44,0 0,10" fill="url(#kiteG)" stroke="url(#gold)" stroke-width="2" />
    <polygon points="0,-48 44,0 0,10" fill="url(#gold)" stroke="url(#gold)" stroke-width="2" />
    <polygon points="-44,0 0,44 0,10" fill="#047857" stroke="url(#gold)" stroke-width="2" />
    <polygon points="44,0 0,44 0,10" fill="#065f46" stroke="url(#gold)" stroke-width="2" />
    <line x1="0" y1="-50" x2="0" y2="46" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
    <path d="M -44,0 Q 0,-24 44,0" fill="none" stroke="url(#gold)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="9" fill="#022c22" stroke="url(#gold)" stroke-width="1.5" />
    <!-- Tail -->
    <polygon points="-10,46 10,46 0,62" fill="url(#gold)" />
  </g>

  <!-- AIMIM Text -->
  <text x="64" y="96" font-family="sans-serif" font-weight="900" font-size="16" fill="url(#gold)" text-anchor="middle" letter-spacing="1">AIMIM</text>
  <text x="64" y="112" font-family="sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">सहारनपुर</text>
</svg>
