name: Build AIMIM Workers APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build web app
        run: npm run build

      - name: Install Capacitor and Sharp
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest sharp --legacy-peer-deps --force
          npx cap init "AIMIM Workers" "com.aimim.workers.saharanpur" --web-dir dist
          npx cap add android

      - name: Generate launcher and adaptive icons
        run: |
          if [ ! -f public/logo.png ]; then
            echo "ERROR: public/logo.png not found"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdirSync, writeFileSync } from 'node:fs';

          const res = 'android/app/src/main/res';
          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };

          for (const [folder, size] of Object.entries(sizes)) {
            const dir = `${res}/${folder}`;
            mkdirSync(dir, { recursive: true });

            for (const name of ['ic_launcher.png', 'ic_launcher_round.png']) {
              await sharp('public/logo.png')
                .resize(size, size, {
                  fit: 'contain',
                  background: '#064e3b'
                })
                .png()
                .toFile(`${dir}/${name}`);
            }
          }

          const drawable = `${res}/drawable-nodpi`;
          const adaptive = `${res}/mipmap-anydpi-v26`;
          const values = `${res}/values`;

          mkdirSync(drawable, { recursive: true });
          mkdirSync(adaptive, { recursive: true });
          mkdirSync(values, { recursive: true });

          await sharp('public/logo.png')
            .resize(432, 432, {
              fit: 'contain',
              background: { r: 6, g: 78, b: 59, alpha: 0 }
            })
            .png()
            .toFile(`${drawable}/ic_launcher_foreground.png`);

          writeFileSync(
            `${adaptive}/ic_launcher.xml`,
            `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>`
          );

          writeFileSync(
            `${adaptive}/ic_launcher_round.xml`,
            `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>`
          );

          writeFileSync(
            `${values}/ic_launcher_background.xml`,
            `<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#064E3B</color>
          </resources>`
          );
          NODE

          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMIM-Workers-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
