
name: Build AIMIM Workers APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps --force
          npm run build || npx vite build

      - name: Add Capacitor and Create Android Folder
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps --force
          npx cap init "AIMIM Workers" "com.aimim.workers.saharanpur" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMIM-Workers-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
