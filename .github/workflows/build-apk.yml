name: Build AIMIM Workers APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip mobile build
        run: |
          if [ -f AIMIM_Workers_Mobile_Cloud_Build.zip ]; then
            unzip -o AIMIM_Workers_Mobile_Cloud_Build.zip -d build_source
          else
            mkdir -p build_source/aimim_android_cloudbuild
            cp -r . build_source/aimim_android_cloudbuild || true
          fi

      - name: Install dependencies and build web app
        run: |
          cd build_source/aimim_android_cloudbuild
          if [ -f package.json ]; then
            npm install --legacy-peer-deps || npm install
            npm run build || true
          fi

      - name: Prepare Android project
        run: |
          cd build_source/aimim_android_cloudbuild
          npx cap add android || true
          npx cap sync android || true

      - name: Build debug APK
        run: |
          cd build_source/aimim_android_cloudbuild/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMIM-Workers-APK
          path: build_source/aimim_android_cloudbuild/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
