
name: Build AIMIM Workers APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps --force
          npm run build || npx vite build

      - name: Add Capacitor and create Android project
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps --force
          npx cap init "AIMIM Workers" "com.aimim.workers.saharanpur" --web-dir dist
          npx cap add android

      - name: Set Android app icon from logo
        run: |
          if [ ! -f public/logo.png ]; then
            echo "ERROR: public/logo.png not found"
            exit 1
          fi

          npm install sharp --no-save --legacy-peer-deps --force

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdirSync } from 'node:fs';

          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };

          for (const [folder, size] of Object.entries(sizes)) {
            const dir = `android/app/src/main/res/${folder}`;
            mkdirSync(dir, { recursive: true });

            await sharp('public/logo.png')
              .resize(size, size, { fit: 'contain', background: '#ffffff' })
              .png()
              .toFile(`${dir}/ic_launcher.png`);

            await sharp('public/logo.png')
              .resize(size, size, { fit: 'contain', background: '#ffffff' })
              .png()
              .toFile(`${dir}/ic_launcher_round.png`);
          }
          NODE

          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMIM-Workers-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
